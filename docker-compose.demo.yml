services:
  lookyloo-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: lookyloo-demo-allinone:latest
    container_name: lookyloo-demo
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_PORT: ${DEMO_DB_PORT:-6534}
      BACKEND_PORT: ${DEMO_BACKEND_PORT:-6535}
      FRONTEND_PORT: ${DEMO_FRONTEND_PORT:-6536}
    ports:
      - "${HOST_DB_PORT:-6534}:${DEMO_DB_PORT:-6534}"
      - "${HOST_BACKEND_PORT:-6535}:${DEMO_BACKEND_PORT:-6535}"
      - "${HOST_FRONTEND_PORT:-6536}:${DEMO_FRONTEND_PORT:-6536}"
    volumes:
      - lookyloo_demo_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  lookyloo_demo_pgdata:
